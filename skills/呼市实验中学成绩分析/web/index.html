<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呼市实验中学成绩分析 · 本地查询</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --ink: #1f2933; --muted: #6b7785;
    --line: #e3e8ef; --accent: #2f6fed; --good: #2bb673; --bad: #e5534b;
    --warn: #f0a020; --chip: #eef3ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink); font-size: 14px; }
  header { background: var(--accent); color: #fff; padding: 14px 22px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: .85; }
  .wrap { display: flex; min-height: calc(100vh - 56px); }
  nav { width: 200px; background: var(--panel); border-right: 1px solid var(--line); padding: 12px; }
  nav button { display: block; width: 100%; text-align: left; border: none; background: none;
               padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--ink); font-size: 14px; }
  nav button:hover { background: var(--chip); }
  nav button.active { background: var(--accent); color: #fff; }
  main { flex: 1; padding: 18px 22px; overflow: auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  label { font-size: 12px; color: var(--muted); margin-right: 6px; }
  select, input[type=text] { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
                             background: #fff; font-size: 13px; color: var(--ink); }
  .exam-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
               display: flex; align-items: center; gap: 10px; cursor: pointer; justify-content: space-between; }
  .exam-card.sel { border-color: var(--accent); background: var(--chip); }
  .exam-card .meta { font-size: 12px; color: var(--muted); }
  .exam-card .title { font-weight: 600; }
  .exam-card .del { border: none; background: #fdeceb; color: var(--bad); border-radius: 6px;
                    padding: 6px 10px; cursor: pointer; font-size: 12px; flex-shrink: 0; }
  .exam-card .del:hover { background: #f9d6d3; }
  .tag { display: inline-block; font-size: 11px; background: var(--chip); color: var(--accent);
         border-radius: 6px; padding: 2px 7px; margin-left: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: center; }
  th { background: #f0f4fb; cursor: pointer; user-select: none; }
  th:hover { background: #e3ecfb; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .bar-label { width: 90px; text-align: right; font-size: 12px; color: var(--muted); }
  .bar-track { flex: 1; background: #f0f3f8; border-radius: 6px; height: 18px; position: relative; }
  .bar-fill { height: 100%; border-radius: 6px; }
  .bar-val { width: 86px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .chart-title { font-size: 13px; font-weight: 600; margin: 14px 0 8px; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 1100px) { .grid3 { grid-template-columns: repeat(2, 1fr); } .grid4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } .grid3 { grid-template-columns: 1fr; } .grid4 { grid-template-columns: 1fr; } nav { width: 140px; } }
  svg text { font-size: 11px; fill: var(--muted); }
  svg .axis { stroke: var(--line); }
  .legend span { display: inline-block; margin-right: 14px; font-size: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
</style>
</head>
<body>
<header>
  <h1>呼市实验中学成绩分析 · 本地查询</h1>
  <p>SQLite 持久化数据 · 班级/校区对比 · 可视化图表</p>
</header>
<div class="wrap">
  <nav>
    <button data-view="exams" class="active">考试列表</button>
    <button data-view="class">班级对比</button>
    <button data-view="campus">校区对比</button>
    <button data-view="teacher">教师得分</button>
  </nav>
  <main id="main"></main>
</div>

<script>
const state = { exams: [], selExams: [], subject: null, view: 'exams', sortBy: 'id_desc' };

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error('请求失败: ' + path);
  return r.json();
}

function fmt(v, d=2) {
  if (v === null || v === undefined) return '-';
  return Number(v).toFixed(d);
}

/* ---------- 顶部导航 ---------- */
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.view = b.dataset.view;
    render();
  };
});

async function render() {
  const main = document.getElementById('main');
  if (state.exams.length === 0) {
    try { state.exams = await api('/api/exams'); } catch(e) { main.innerHTML = '<div class="empty">无法连接数据库，请先运行分析并启动服务。</div>'; return; }
    if (state.exams.length && state.selExams.length === 0) state.selExams = [state.exams[0].id];
  }
  if (state.view === 'exams') return renderExams();
  if (state.view === 'class') return renderClass();
  if (state.view === 'campus') return renderCampus();
  if (state.view === 'teacher') return renderTeacher();
}

/* ---------- 考试列表 ---------- */
function sortExams(list) {
  const arr = [...list];
  const by = state.sortBy || 'id_desc';
  const dateVal = e => e.exam_date || '';
  if (by === 'id_asc') arr.sort((a, b) => a.id - b.id);
  else if (by === 'date_asc') arr.sort((a, b) => dateVal(a) < dateVal(b) ? -1 : dateVal(a) > dateVal(b) ? 1 : a.id - b.id);
  else if (by === 'date_desc') arr.sort((a, b) => dateVal(a) > dateVal(b) ? -1 : dateVal(a) < dateVal(b) ? 1 : b.id - a.id);
  else if (by === 'name_asc') arr.sort((a, b) => (String(a.exam_name || '').localeCompare(String(b.exam_name || ''), 'zh')) || (a.id - b.id));
  else arr.sort((a, b) => b.id - a.id);
  return arr;
}

async function deleteExam(id) {
  if (!confirm('确定删除该考试及其全部明细数据吗？此操作不可撤销。')) return;
  try {
    const r = await fetch('/api/exam_delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ exam_id: id })
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || '删除失败');
  } catch (e) {
    alert('删除失败：' + e.message);
    return;
  }
  state.exams = await api('/api/exams');
  state.selExams = state.selExams.filter(x => x !== id);
  if (state.exams.length && state.selExams.length === 0) state.selExams = [state.exams[0].id];
  renderExams();
}

function renderExams() {
  const main = document.getElementById('main');
  if (!state.exams.length) { main.innerHTML = '<div class="empty">暂无分析记录。请先运行 score_analysis.py 生成结果。</div>'; return; }
  let html = '<div class="panel"><h2>考试记录（点击勾选用于对比）</h2>';
  html += '<div class="row"><label>排序</label>'
    + '<select id="sortBy">'
    + '<option value="id_desc">录入顺序（新→旧）</option>'
    + '<option value="id_asc">录入顺序（旧→新）</option>'
    + '<option value="date_asc">考试日期（早→晚）</option>'
    + '<option value="date_desc">考试日期（晚→早）</option>'
    + '<option value="name_asc">考试名称（A→Z）</option>'
    + '</select>'
    + '<span class="meta">共 ' + state.exams.length + ' 次分析。勾选后可在「班级对比」中跨考试查看走势；右侧可删除单场考试。</span></div>';
  sortExams(state.exams).forEach(e => {
    const sel = state.selExams.includes(e.id);
    html += `<div class="exam-card ${sel ? 'sel' : ''}" data-id="${e.id}">
      <input type="checkbox" ${sel ? 'checked' : ''} />
      <div style="flex:1"><div class="title">${e.exam_info || '(未命名考试)'}</div>
      <div class="meta">${e.exam_date || ''} · 班级 ${e.class_count} · 学科 ${e.subject_count} · 教师 ${e.teacher_count} · ${e.created_at}</div></div>
      <button class="del" data-id="${e.id}">删除</button>
    </div>`;
  });
  html += '</div>';
  main.innerHTML = html;
  document.getElementById('sortBy').value = state.sortBy;
  document.getElementById('sortBy').onchange = e => { state.sortBy = e.target.value; renderExams(); };
  document.querySelectorAll('.exam-card').forEach(c => {
    c.onclick = (ev) => {
      if (ev.target.classList.contains('del')) return;
      const id = Number(c.dataset.id);
      if (ev.target.tagName !== 'INPUT') {
        const cb = c.querySelector('input');
        cb.checked = !cb.checked;
      }
      if (c.querySelector('input').checked) { if (!state.selExams.includes(id)) state.selExams.push(id); }
      else state.selExams = state.selExams.filter(x => x !== id);
      c.classList.toggle('sel', c.querySelector('input').checked);
    };
  });
  document.querySelectorAll('.exam-card .del').forEach(b => {
    b.onclick = (ev) => { ev.stopPropagation(); deleteExam(Number(b.dataset.id)); };
  });
}

/* ---------- 通用条形图 ---------- */
function barChart(title, items, valueFn, opts={}) {
  if (!items.length) return `<div class="chart-title">${title}</div><div class="empty">无数据</div>`;
  const vals = items.map(valueFn).filter(v => v !== null && v !== undefined);
  let max = Math.max(...vals.map(Math.abs), 0.0001);
  if (opts.symmetric) max = Math.max(max, -Math.min(...vals, 0));
  let rows = '';
  items.forEach(it => {
    const v = valueFn(it);
    const label = opts.labelFn ? opts.labelFn(it) : it.班级;
    const disp = (v===null||v===undefined) ? '-' : (opts.fmt ? opts.fmt(v) : fmt(v, opts.d??2));
    let w = 0, color = opts.color || 'var(--accent)';
    if (v !== null && v !== undefined) {
      w = Math.abs(v) / max * 100;
      if (opts.colorFn) color = opts.colorFn(v, it);
      else if (opts.signed) color = v >= 0 ? 'var(--good)' : 'var(--bad)';
    }
    rows += `<div class="bar-row"><div class="bar-label" title="${label}">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
      <div class="bar-val ${opts.signed && v<0?'neg':(opts.signed&&v>0?'pos':'')}">${disp}</div></div>`;
  });
  return `<div class="chart-title">${title}</div>${rows}`;
}

/* ---------- 班级对比 ---------- */
// 班级图表标签：<校区>-<教师姓名>（缺项自动省略，两者皆缺时回退班级名）
function classLabel(m) {
  const parts = [m.校区, m.教师姓名].filter(x => x && String(x).trim() !== '');
  return parts.length ? parts.join('-') : (m.班级 || '-');
}

async function renderClass() {
  const main = document.getElementById('main');
  if (!state.selExams.length) { main.innerHTML = '<div class="empty">请先在「考试列表」勾选至少一次考试。</div>'; return; }
  const eid = state.selExams[0];
  const subjects = await api('/api/subjects?exam_id=' + eid);
  if (!state.subject || !subjects.includes(state.subject)) state.subject = subjects[0];
  const metrics = await api('/api/class_metrics?exam_id=' + eid + '&subject=' + encodeURIComponent(state.subject));

  // 班级 → 展示标签 映射（供跨考试走势下拉/折线图使用）
  const labelMap = {};
  metrics.forEach(m => { if (!(m.班级 in labelMap)) labelMap[m.班级] = classLabel(m); });

  let html = '<div class="panel"><div class="row"><label>考试科目</label>'
    + '<select id="subj">' + subjects.map(s => `<option ${s===state.subject?'selected':''}>${s}</option>`).join('') + '</select>'
    + '<span class="meta">主考试：' + (state.exams.find(e=>e.id===eid)?.exam_info||'') + '</span></div>';

  // 通用指标条形图（横向 3 列，6 张图排成 2 行更整齐）
  // 「均分」为结果评价指标，其值即第二场班级均分（不做两场之差），与 T分差/正负 的进步幅度指标互补
  const sorted = [...metrics].sort((a,b)=>(b.均分||0)-(a.均分||0));
  html += '<div class="grid3">';
  html += '<div>' + barChart('均分', sorted, m=>m.均分, {labelFn:classLabel, d:1}) + '</div>';
  html += '<div>' + barChart('T分差（第二场−第一场）', [...metrics].sort((a,b)=>(b.T分差||0)-(a.T分差||0)), m=>m.T分差, {labelFn:classLabel, signed:true, d:2}) + '</div>';
  html += '<div>' + barChart('排名正负（正值=进步）', [...metrics].sort((a,b)=>(b.正负||0)-(a.正负||0)), m=>m.正负, {labelFn:classLabel, signed:true, d:2}) + '</div>';
  html += '<div>' + barChart('优秀人数差（第二场−第一场）', [...metrics].sort((a,b)=>(b.优秀人数差||0)-(a.优秀人数差||0)), m=>m.优秀人数差, {labelFn:classLabel, signed:true, d:0}) + '</div>';
  html += '<div>' + barChart('出库人数差', [...metrics].sort((a,b)=>(b.出库人数差||0)-(a.出库人数差||0)), m=>m.出库人数差, {labelFn:classLabel, signed:true, d:0}) + '</div>';
  html += '<div>' + barChart('参考率', [...metrics].sort((a,b)=>(b.参考率||0)-(a.参考率||0)), m=>m.参考率, {labelFn:classLabel, d:4}) + '</div>';
  html += '</div>';

  // 跨考试走势
  if (state.selExams.length >= 2) {
    const classes = await api('/api/classes?exam_id=' + eid + '&subject=' + encodeURIComponent(state.subject));
    html += '<div class="panel" style="margin-top:16px"><h2>跨考试走势（' + state.subject + '）</h2>';
    html += '<div class="row"><label>班级</label><select id="cls">'
      + classes.map(c=>`<option value="${c}">${labelMap[c]||c}</option>`).join('') + '</select></div>';
    html += '<div id="trend"></div></div>';
  }

  // 明细表
  html += '<div class="panel"><h2>班级指标明细（' + state.subject + '）</h2><table><thead><tr>'
    + ['班级','校区','均分1','均分','T分差','正负','优秀差','出库差','参考率'].map(h=>`<th>${h}</th>`).join('')
    + '</tr></thead><tbody>';
  metrics.sort((a,b)=>(b.均分||0)-(a.均分||0)).forEach(m => {
    html += `<tr><td>${m.班级}</td><td>${m.campus||'-'}</td><td>${fmt(m.均分1,1)}</td>`
      + `<td><b>${fmt(m.均分,1)}</b></td>`
      + `<td class="${m.T分差>=0?'pos':'neg'}">${fmt(m.T分差,2)}</td>`
      + `<td class="${m.正负>=0?'pos':'neg'}">${fmt(m.正负,2)}</td>`
      + `<td class="${m.优秀人数差>=0?'pos':'neg'}">${m.优秀人数差}</td>`
      + `<td class="${m.出库人数差>=0?'pos':'neg'}">${m.出库人数差}</td>`
      + `<td>${fmt(m.参考率,4)}</td></tr>`;
  });
  html += '</tbody></table></div></div>';
  main.innerHTML = html;

  document.getElementById('subj').onchange = e => { state.subject = e.target.value; renderClass(); };
  const clsSel = document.getElementById('cls');
  if (clsSel) clsSel.onchange = () => drawTrend(clsSel.value, labelMap[clsSel.value] || clsSel.value);
  if (state.selExams.length >= 2 && clsSel) drawTrend(clsSel.value, labelMap[clsSel.value] || clsSel.value);
}

async function drawTrend(cls, label) {
  const box = document.getElementById('trend');
  const data = await api('/api/compare?subject=' + encodeURIComponent(state.subject)
    + '&classes=' + encodeURIComponent(cls)
    + '&exam_ids=' + state.selExams.join(','));
  const labels = data.exam_info_list;
  const s = data.series[cls] || [];
  const nm = label || cls;
  // 「均分」（结果评价，其值即第二场班级均分，不做差）与 T分差（进步幅度）各做一条
  box.innerHTML = lineChart(nm + ' · 均分走势', labels, [{name: nm, values: s.map(x=>x.均分)}]);
  box.innerHTML += lineChart(nm + ' · T分差走势', labels, [{name: nm, values: s.map(x=>x.T分差)}]);
}

/* ---------- SVG 折线图（纯原生） ---------- */
function lineChart(title, labels, series) {
  if (!labels.length) return '';
  const W=640, H=220, padL=40, padR=16, padT=24, padB=40;
  const all = series.flatMap(s=>s.values.filter(v=>v!==null&&v!==undefined));
  let min = Math.min(...all), max = Math.max(...all);
  if (min===max){ min-=1; max+=1; }
  const range = (max-min)||1;
  const xStep = labels.length>1 ? (W-padL-padR)/(labels.length-1) : 0;
  const xOf = i => labels.length>1 ? padL + i*xStep : (W-padL-padR)/2 + padL;
  const yOf = v => padT + (1-(v-min)/range)*(H-padT-padB);
  let svg = `<div class="chart-title">${title}</div><svg viewBox="0 0 ${W} ${H}" width="100%">`;
  // y 轴网格
  for (let i=0;i<=4;i++){
    const v = min + range*i/4, y = yOf(v);
    svg += `<line class="axis" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    svg += `<text x="${padL-6}" y="${y+4}" text-anchor="end">${fmt(v,1)}</text>`;
  }
  // x 轴标签
  labels.forEach((lb,i)=>{ svg += `<text x="${xOf(i)}" y="${H-padB+18}" text-anchor="middle">${lb.length>10?lb.slice(0,10)+'…':lb}</text>`; });
  const colors=['#2f6fed','#2bb673','#f0a020','#e5534b','#8e5cf7'];
  series.forEach((s,si)=>{
    const pts = s.values.map((v,i)=> v===null||v===undefined?null:[xOf(i),yOf(v)]).filter(Boolean);
    if (pts.length){
      const d = pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
      svg += `<path d="${d}" fill="none" stroke="${colors[si%colors.length]}" stroke-width="2"/>`;
      pts.forEach(p=> svg += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${colors[si%colors.length]}"/>`);
    }
  });
  svg += '</svg>';
  return svg;
}

/* ---------- 校区对比 ---------- */
async function renderCampus() {
  const main = document.getElementById('main');
  if (!state.selExams.length) { main.innerHTML = '<div class="empty">请先在「考试列表」勾选至少一次考试。</div>'; return; }
  const eid = state.selExams[0];
  const subjects = await api('/api/subjects?exam_id=' + eid);
  if (!state.subject || !subjects.includes(state.subject)) state.subject = subjects[0];
  const rows = await api('/api/campus?exam_id=' + eid + '&subject=' + encodeURIComponent(state.subject));
  let html = '<div class="panel"><div class="row"><label>考试科目</label>'
    + '<select id="subj2">' + subjects.map(s => `<option ${s===state.subject?'selected':''}>${s}</option>`).join('') + '</select></div>';
  if (!rows.length) html += '<div class="empty">该考试无校区信息（教师任课表需含「校区」列）。</div>';
  else {
    const campusLabel = r=>(r.校区||r.campus||'(未标注)');
    html += barChart('校区 · 平均均分', rows, r=>r.平均均分, {labelFn:campusLabel, d:1});
    html += barChart('校区 · 平均T分差', rows, r=>r.平均T分差, {labelFn:campusLabel, signed:true, d:2});
    html += barChart('校区 · 优秀人数差合计', rows, r=>r.优秀人数差合计, {labelFn:campusLabel, signed:true, d:0});
    html += barChart('校区 · 出库人数差合计', rows, r=>r.出库人数差合计, {labelFn:campusLabel, signed:true, d:0});
    html += barChart('校区 · 平均参考率', rows, r=>r.平均参考率, {labelFn:campusLabel, d:4});
    html += '<table style="margin-top:14px"><thead><tr>'
      + ['校区','班级数','平均均分','平均T分差','优秀差合计','出库差合计','平均参考率'].map(h=>`<th>${h}</th>`).join('')
      + '</tr></thead><tbody>';
    rows.forEach(r=>{ html += `<tr><td>${r.校区||'(未标注)'}</td><td>${r.班级数}</td>`
      + `<td><b>${fmt(r.平均均分,1)}</b></td>`
      + `<td class="${r.平均T分差>=0?'pos':'neg'}">${fmt(r.平均T分差,2)}</td>`
      + `<td class="${r.优秀人数差合计>=0?'pos':'neg'}">${r.优秀人数差合计}</td>`
      + `<td class="${r.出库人数差合计>=0?'pos':'neg'}">${r.出库人数差合计}</td>`
      + `<td>${fmt(r.平均参考率,4)}</td></tr>`; });
    html += '</tbody></table>';
  }
  html += '</div>';
  main.innerHTML = html;
  document.getElementById('subj2').onchange = e => { state.subject = e.target.value; renderCampus(); };
}

/* ---------- 教师得分 ---------- */
async function renderTeacher() {
  const main = document.getElementById('main');
  if (!state.selExams.length) { main.innerHTML = '<div class="empty">请先在「考试列表」勾选至少一次考试。</div>'; return; }
  const eid = state.selExams[0];
  const rows = await api('/api/teacher_scores?exam_id=' + eid);
  if (!rows.length) { main.innerHTML = '<div class="empty">该考试无教师得分数据。</div>'; return; }
  const cols = [['姓名','姓名'],['科目','科目'],['校区','校区'],['排名正负','排名正负'],['T分差','T分差'],['均分','均分'],['优秀人数','优秀人数'],['出库人数','出库人数'],['参考率','参考率'],['总分','总分']];
  let html = '<div class="panel"><h2>教师得分表</h2><div style="overflow:auto"><table id="tt"><thead><tr>'
    + cols.map(c=>`<th data-k="${c[1]}">${c[0]}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach(r=>{
    html += '<tr>' + cols.map(c=>{
      const v = r[c[1]];
      if (c[1]==='总分') return `<td><b>${fmt(v,2)}</b></td>`;
      if (['排名正负','T分差','优秀人数','出库人数'].includes(c[1])) return `<td class="${v>=0?'pos':'neg'}">${fmt(v, 2)}</td>`;
      if (c[1]==='均分') return `<td><b>${fmt(v,1)}</b></td>`;
      if (c[1]==='参考率') return `<td>${fmt(v,4)}</td>`;
      return `<td>${v??'-'}</td>`;
    }).join('') + '</tr>';
  });
  html += '</tbody></table></div></div>';
  main.innerHTML = html;
  document.querySelectorAll('#tt th').forEach(th=>{
    th.onclick = () => {
      const k = th.dataset.k, asc = th.dataset.asc==='1';
      rows.sort((a,b)=> (a[k]>b[k]?1:a[k]<b[k]?-1:0)*(asc?1:-1));
      th.dataset.asc = asc?0:1;
      renderTeacher();
    };
  });
}

render();
</script>
</body>
</html>
